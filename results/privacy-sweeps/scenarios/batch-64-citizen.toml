# The scored generator baseline: sixteen citizens with four copies each, presented to four
# verifiers, scored for the parties in docs/scenario-proposal.md. The stack settings model a
# custodial issuer that keeps one registry per credential, allocates registries first in first out,
# issues a citizen's copies together and stamps exact TEL `dt` values. The pharmacy is shown county
# alone, because no credential field carries veteran status.

[run]
seed = 20261117
adapter = "generator"
confidence_cut = 1.0

[population]
size = 3500000
seed = 1
homes = 4
home_assignment = "uniform"

[[population.attribute]]
name = "age-band"
values = ["18-20", "21-29", "30-44", "45-64", "65+"]
probabilities = [0.06, 0.18, 0.28, 0.31, 0.17]
sensitive = false

[[population.attribute]]
name = "county"
values = ["county-a", "county-b", "county-c", "county-d", "other"]
probabilities = [0.36, 0.2, 0.11, 0.08, 0.25]
sensitive = false

[[population.attribute]]
name = "veteran"
values = ["no", "yes"]
probabilities = [0.93, 0.07]
sensitive = true

[[population.correlation]]
a = "age-band"
b = "veteran"
rho = 0.3

[citizens]
count = 16
copies = 4
issuance_period = 2592000.0
copy_interval = 0.004

[[domain]]
name = "alcohol"
mandatory = true

[[domain]]
name = "pharmacy"
mandatory = false


[[verifier]]
id = "liquor-store"

[[verifier]]
id = "pharmacy"

[[verifier]]
id = "bar"

[[verifier]]
id = "clinic"

[[presentation]]
verifier = "liquor-store"
domain = "alcohol"
disclose = ["age-band"]
per_citizen = 1
start = 2678400.0
end = 5184000.0

[[presentation]]
verifier = "pharmacy"
domain = "pharmacy"
disclose = ["county"]
per_citizen = 1
start = 2678400.0
end = 5184000.0

[[presentation]]
verifier = "bar"
domain = "alcohol"
disclose = ["age-band"]
per_citizen = 1
start = 2678400.0
end = 5184000.0

[[presentation]]
verifier = "clinic"
domain = "pharmacy"
disclose = ["county"]
per_citizen = 1
start = 2678400.0
end = 5184000.0

[stack]
registry_scope = "credential"
registry_allocation = "fifo"
issuance_order = "per-citizen"
dt_granularity = 0.0
tel_updates = "upd"
status_updates = "none"
batch_size = 64
batch_mix = "citizen"
publication_window = 0.0
holder_network = "direct"
holder_status_reads = false
hosted_agents = "none"
verifier_probing = false
identity_oracle = false
sealed_revocation_map = false
decoys = 0
log_join_material = false
holder_aids = "transferable"
holder_witnesses = "pool"
copy_template = "fresh"
first_seen = "exact"
anchor_order = "issuance"

[stack.retention]
public = inf
verifier = inf
issuing-home = inf
orchestrator = inf
operation-log = inf
revocation-authority = inf
identity-proofing = inf
access-log = inf

[[party]]
name = "two-verifiers"
kind = "colluding-verifier"
compartments = ["public", "verifier:liquor-store", "verifier:pharmacy"]
obtains_at = 5184000.0
terms = []
context_bits = 0.0

[[party]]
name = "two-verifiers-terms"
