[project]
name = "kpa-adapter-keria"
version = "2026.10"
description = "The keri-priv-analysis-suite adapter for KERIA agents driven by SignifyPy."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Bakobo LLC" }]
# The suite (keripy 2.x) is this project's environment. KERIA and SignifyPy (keripy 1.2.x) live in
# the sibling project stack/, which the adapter runs as a child process (README.md, "Two
# environments").
dependencies = ["keri-priv-analysis-suite"]

[project.entry-points."keri_priv_analysis.adapters"]
keria = "kpa_adapter_keria:Adapter"

[tool.uv.sources]
keri-priv-analysis-suite = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kpa_adapter_keria"]

[tool.pytest.ini_options]
addopts = "--cov=kpa_adapter_keria --cov-branch --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
markers = ["slow: drives the live KERIA stack"]
filterwarnings = ["ignore::DeprecationWarning:pysodium"]

[tool.ruff]
line-length = 100
